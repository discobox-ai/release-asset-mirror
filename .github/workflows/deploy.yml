# Manual deploy from CI, for repositories that would rather not hand out
# Wrangler logins. Add a Cloudflare API token with "Edit Cloudflare Workers"
# and R2 read/write as the CLOUDFLARE_API_TOKEN repository secret, then run
# this workflow and name the environment to deploy.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Named environment from wrangler.jsonc. Leave empty for the default
          (top-level) deployment.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env "${{ inputs.environment }}"
