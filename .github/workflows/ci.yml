name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, format, test
        run: npm run check

      - name: Bundle every configured deployment
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --env=""
          node scripts/environments.mjs | while read -r name; do
            echo "::group::wrangler --env $name"
            npx wrangler deploy --dry-run --env "$name"
            echo "::endgroup::"
          done
